repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Configure project-specific linter and test hooks below
      - id: lint
        name: linter
        entry: make lint
        language: system
        pass_filenames: false

      - id: test
        name: test suite
        entry: make test
        language: system
        pass_filenames: false
